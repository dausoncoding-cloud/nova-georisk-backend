# Backlog 37 (owner-approved 2026-11-21): unknown hosts and the bare IP get no answer. The named servers in app.conf
# (api.novageorisk.com) and frontend-app.conf (app.novageorisk.com) are unchanged. Loaded after app.conf, which defines
# the main_host log format.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log main_host;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    access_log /var/log/nginx/access.log main_host;
    ssl_reject_handshake on;
}
