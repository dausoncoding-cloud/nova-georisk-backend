# PREPARED ONLY. Do not activate before approved OIDC, migration and live readiness gates.
server {
    listen 80;
    server_name app.novageorisk.com;
    access_log /var/log/nginx/access.log main_host;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name app.novageorisk.com;
    access_log /var/log/nginx/access.log main_host;
    resolver 127.0.0.11 ipv6=off;
    ssl_certificate /etc/letsencrypt/live/app.novageorisk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.novageorisk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 20m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Nova-Release "backend-2f1b2dc_frontend-8465bd5" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; form-action 'self'" always;
    location ^~ /outputs/ { return 404; }
    location ^~ /auth/ {
        access_log off; # Keep authorization codes/state out of access logs.
        limit_req zone=nova_release_browser_auth burst=20 nodelay;
        set $auth_upstream firris-2f1b2dc-bff:8001;
        proxy_pass http://$auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Nova-User-Id "";
        proxy_set_header X-Nova-Organization-Id "";
        proxy_set_header X-Nova-Role "";
        proxy_set_header Connection "";
    }
    # Abliner webhook (security review L8): exact match, so it wins over ^~ /api/ and is capped at 64 KB here at the
    # edge, before any buffering. Same BFF upstream; the BFF route still rate-limits, caps the body and verifies the
    # HMAC in the API. No session: cookie and every identity header are blanked. All directives repeated.
    location = /api/v1/webhooks/abliner {
        client_max_body_size 64k;
        limit_req zone=nova_release_browser_api burst=60 nodelay;
        set $webhook_upstream firris-2f1b2dc-bff:8001;
        proxy_pass http://$webhook_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Nova-User-Id "";
        proxy_set_header X-Nova-Organization-Id "";
        proxy_set_header X-Nova-Role "";
        proxy_set_header X-Nova-Session-Ref "";
        proxy_set_header Connection "";
    }
    location ^~ /api/ {
        limit_req zone=nova_release_browser_api burst=60 nodelay;
        set $browser_api_upstream firris-2f1b2dc-bff:8001;
        proxy_pass http://$browser_api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 330s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Nova-User-Id "";
        proxy_set_header X-Nova-Organization-Id "";
        proxy_set_header X-Nova-Role "";
        proxy_set_header Connection "";
        # 50 MB exception for the External data upload route only (owner decision 2026-11-27); every other route keeps
        # the server's 20m. Nested so the ^~ /api/ prefix cannot shadow it; all directives repeated (no inheritance).
        location ~ "^/api/v1/projects/[0-9a-fA-F-]{36}/external-datasets$" {
            client_max_body_size 50m;
            limit_req zone=nova_release_browser_api burst=60 nodelay;
            set $upload_upstream firris-2f1b2dc-bff:8001;
            proxy_pass http://$upload_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 330s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Internal-Secret "";
            proxy_set_header X-Nova-User-Id "";
            proxy_set_header X-Nova-Organization-Id "";
            proxy_set_header X-Nova-Role "";
            proxy_set_header X-Nova-Session-Ref "";
            proxy_set_header Connection "";
        }
    }
    location / {
        set $frontend_upstream firris-2f1b2dc-gateway:8080;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Nova-User-Id "";
        proxy_set_header X-Nova-Organization-Id "";
        proxy_set_header X-Nova-Role "";
    }
}
