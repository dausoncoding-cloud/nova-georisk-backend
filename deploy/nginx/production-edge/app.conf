# Public host api.novageorisk.com (release r8): GET/HEAD /health only; everything else 404.
# Edge access log with the request host (owner decision 2026-11-21); same fields as main, plus "$host".
log_format main_host '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" "$host"';
limit_req_zone $binary_remote_addr zone=nova_release_browser_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nova_release_browser_auth:10m rate=10r/s;
# Abliner webhook only (security review round 4, item 5): its own zone, never the browser one; same as the gateway's.
limit_req_zone $binary_remote_addr zone=nova_release_webhook:10m rate=5r/s;
server {
    listen 80;
    server_name api.novageorisk.com;
    access_log /var/log/nginx/access.log main_host;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name api.novageorisk.com;
    access_log /var/log/nginx/access.log main_host;
    resolver 127.0.0.11 ipv6=off;
    ssl_certificate /etc/letsencrypt/live/api.novageorisk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.novageorisk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 20m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Nova-Release "backend-2f1b2dc_frontend-8465bd5" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; form-action 'self'" always;
    # Security review M1 (owner decision, 2026-11-21; release r8): this public host serves only GET/HEAD /health.
    # Browsers use app.novageorisk.com (gateway, BFF); the BFF, the worker and operator commands reach the API over
    # the internal Docker network. Every other path, including /api/*, /auth/*, /docs, /openapi.json and /outputs/*,
    # is 404 here. The two limit_req_zone lines above stay: frontend-app.conf uses them.
    location = /health {
        default_type application/json;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 404 '{"detail":"Not Found","error":{"code":"http_404","message":"Not Found","request_id":"$request_id","details":null}}';
        }
        set $health_upstream firris-2f1b2dc-api:8000;
        proxy_pass http://$health_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Nova-User-Id "";
        proxy_set_header X-Nova-Organization-Id "";
        proxy_set_header X-Nova-Role "";
        proxy_set_header X-Nova-Session-Ref "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location / {
        default_type application/json;
        return 404 '{"detail":"Not Found","error":{"code":"http_404","message":"Not Found","request_id":"$request_id","details":null}}';
    }
}
