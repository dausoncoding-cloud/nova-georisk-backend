# Public host api.novageorisk.com: health check only (GET /health). Browser traffic belongs on
# app.novageorisk.com through the BFF; services reach the API on the internal Docker network.

limit_req_zone $binary_remote_addr zone=nova_api:10m rate=20r/s;

server {
    listen 80;
    server_name api.novageorisk.com;
    resolver 127.0.0.11 ipv6=off;

    # Required for Certbot's HTTP-01 challenge to renew the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: send to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.novageorisk.com;
    resolver 127.0.0.11 ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/api.novageorisk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.novageorisk.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 21m;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Request-Id $request_id always;

    error_page 413 = @payload_too_large;
    error_page 429 = @rate_limited;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"detail":"Payload too large.","error":{"code":"http_413","message":"Payload too large.","request_id":"$request_id","details":null}}';
    }
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"Too many requests.","error":{"code":"http_429","message":"Too many requests.","request_id":"$request_id","details":null}}';
    }

    # Security review M1 (owner decision, 2026-11-21): this public host serves only GET /health.
    # Browsers use the BFF on the app host; the BFF, the worker and operator commands reach the API over the
    # internal Docker network (http://api:8000). Every other path, including /api/*, /docs, /openapi.json,
    # /auth/* and /outputs/*, does not exist here.
    location = /health {
        default_type application/json;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 404 '{"detail":"Not Found","error":{"code":"http_404","message":"Not Found","request_id":"$request_id","details":null}}';
        }
        limit_req zone=nova_api burst=40 nodelay;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # Health needs no identity; never pass one through.
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Nova-User-Id "";
        proxy_set_header X-Nova-Organization-Id "";
        proxy_set_header X-Nova-Role "";
        proxy_set_header X-Nova-Session-Ref "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        default_type application/json;
        return 404 '{"detail":"Not Found","error":{"code":"http_404","message":"Not Found","request_id":"$request_id","details":null}}';
    }
}
