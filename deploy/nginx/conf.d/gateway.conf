limit_req_zone $binary_remote_addr zone=nova_gateway_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nova_gateway_auth:10m rate=10r/s;

upstream nova_gateway_bff {
    server bff:8001;
    keepalive 32;
}

# Browser-facing, same-origin entry point. TLS should terminate here (or at a
# trusted upstream load balancer) in staging and production. Browser API calls
# intentionally go through the BFF so that FastAPI's internal secret remains
# server-side and organization/project authorization is enforced.
server {
    listen 8080 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /healthz/frontend {
        access_log off;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files /index.html =503;
    }

    location = /healthz/bff {
        access_log off;
        proxy_pass http://nova_gateway_bff/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Nova-User-Id "";
        proxy_set_header X-Nova-Organization-Id "";
        proxy_set_header X-Nova-Role "";
    }

    location ^~ /outputs/ {
        return 404;
    }

    location ^~ /auth/ {
        limit_req zone=nova_gateway_auth burst=20 nodelay;
        proxy_pass http://nova_gateway_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # Never accept browser-supplied internal identity or service secrets.
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Nova-User-Id "";
        proxy_set_header X-Nova-Organization-Id "";
        proxy_set_header X-Nova-Role "";
    }

    location ^~ /api/ {
        limit_req zone=nova_gateway_api burst=60 nodelay;
        proxy_pass http://nova_gateway_bff;
        proxy_http_version 1.1;
        # Preserve incremental protected artifact delivery and COG byte ranges.
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # These headers are exclusively generated by the BFF for FastAPI.
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Nova-User-Id "";
        proxy_set_header X-Nova-Organization-Id "";
        proxy_set_header X-Nova-Role "";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
