name: nova-georisk-gateway-test

x-gateway-environment: &gateway-environment
  APP_ENV: staging
  DEBUG: "false"
  INTERNAL_API_SECRET: gateway-test-internal-secret-not-for-production
  DATABASE_URL: postgresql+psycopg2://nova_gateway:nova_gateway@postgis-gateway:5432/nova_gateway
  REDIS_URL: redis://redis-gateway:6379/0
  CELERY_BROKER_URL: redis://redis-gateway:6379/1
  CELERY_RESULT_BACKEND: redis://redis-gateway:6379/2
  ARTIFACT_STORAGE_BACKEND: filesystem
  OUTPUT_STORAGE_DIR: /app/outputs
  INTERNAL_API_BASE_URL: http://api-gateway:8000
  SESSION_COOKIE_NAME: nova_session
  SESSION_COOKIE_SECURE: "false"
  SESSION_COOKIE_SAMESITE: lax
  EXPOSE_API_DOCS: "false"
  PUBLIC_OUTPUTS_ENABLED: "false"
  MEMBERSHIP_PROVISIONING_POLICY: strict
  OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?OIDC_ISSUER_URL is required}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8000/auth/callback}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
  OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256,ES256}
  OIDC_TOKEN_ENDPOINT_AUTH_METHOD: ${OIDC_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_post}
  OIDC_BOOTSTRAP_FIRST_USER_ENABLED: "true"
  OIDC_BOOTSTRAP_ORGANIZATION_ID: ${OIDC_BOOTSTRAP_ORGANIZATION_ID:-00000000-0000-0000-0000-000000000001}

services:
  postgis-gateway:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nova_gateway
      POSTGRES_USER: nova_gateway
      POSTGRES_PASSWORD: nova_gateway
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_gateway -d nova_gateway"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-gateway:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate-gateway:
    build: .
    environment: *gateway-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgis-gateway:
        condition: service_healthy

  provision-demo-entitlement:
    build: .
    environment: *gateway-environment
    command:
      - python
      - -m
      - scripts.admin_entitlements
      - --organization-id
      - ${OIDC_BOOTSTRAP_ORGANIZATION_ID:-00000000-0000-0000-0000-000000000001}
      - --engine-key
      - firris
      - --status
      - active
      - --source
      - staging-demo-fixture
      - --commit
    depends_on:
      migrate-gateway:
        condition: service_completed_successfully

  api-gateway:
    build: .
    environment: *gateway-environment
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    volumes:
      - gateway-artifacts:/app/outputs
    depends_on:
      provision-demo-entitlement:
        condition: service_completed_successfully
      redis-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker-gateway:
    build: .
    environment: *gateway-environment
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      provision-demo-entitlement:
        condition: service_completed_successfully
      redis-gateway:
        condition: service_healthy
    volumes:
      - gateway-artifacts:/app/outputs
    healthcheck:
      test: ["CMD-SHELL", "python -c 'from app.core.artifact_storage import require_artifact_storage_ready; require_artifact_storage_ready()' && celery -A app.core.celery_app.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 15s

  bff-gateway:
    build: .
    environment: *gateway-environment
    command: ["uvicorn", "app.bff.main:app", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001"
    networks:
      default:
        aliases:
          - bff
    depends_on:
      api-gateway:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nginx-gateway:
    # Static React image is built in nova-georisk-frontend at the matching release.
    image: ${NOVA_FRONTEND_IMAGE:-nova-georisk-frontend:local}
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./deploy/nginx/conf.d/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bff-gateway:
        condition: service_healthy
      worker-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz && wget -q -O /dev/null http://127.0.0.1:8080/healthz/frontend || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  gateway-artifacts:
